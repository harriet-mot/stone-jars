<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo and Hannah's stone jars</title>
<style>
  body {
    margin: 0;
    background: #E6E2D9;
    color: #1E2A2F;
    font-family: -apple-system, "Helvetica Neue", "Avenir Next", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.45;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 38px; line-height: 1.1; margin: 0 0 6px; font-weight: bold; letter-spacing: -0.01em; }
  .sub { color: #5C6B70; margin: 0 0 20px; }

  .months { margin: 0 0 26px; padding: 0; list-style: none; }
  .months li { display: inline-block; margin: 0 8px 8px 0; }
  .months button {
    font: inherit; font-weight: bold; color: #1E2A2F; background: #F7F5F0;
    border: none; border-radius: 999px; padding: 10px 22px; min-height: 44px;
  }
  .months button.active { background: #2F6F8F; color: #fff; }

  .kids { display: -webkit-box; display: -webkit-flex; display: flex;
          -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -10px; }
  .kid { background: #F7F5F0; border-radius: 28px; padding: 24px 24px 28px;
         -webkit-box-flex: 1; -webkit-flex: 1 1 380px; flex: 1 1 380px;
         margin: 0 10px 20px; min-width: 280px; }
  .kid h2 { margin: 0; font-size: 32px; font-weight: bold; }
  .total { margin: 6px 0 0; color: #5C6B70; }
  .total b { font-size: 40px; color: #1E2A2F; }
  .delta { margin: 2px 0 16px; color: #5C6B70; font-size: 16px; }

  .bars { list-style: none; margin: 0; padding: 0; }
  .bars li { margin-bottom: 13px; }
  .lbl { display: block; font-size: 15px; margin-bottom: 4px; }
  .track { display: block; height: 28px; margin-right: 48px; background: #DDE5E6; border-radius: 999px; overflow: hidden; }
  .fill { display: block; height: 100%; border-radius: 999px;
          -webkit-transform-origin: left; transform-origin: left;
          -webkit-animation: grow .6s ease-out backwards; animation: grow .6s ease-out backwards; }
  @-webkit-keyframes grow { from { -webkit-transform: scaleX(0); } to { -webkit-transform: scaleX(1); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .fill.black { background: #151515; }
  .fill.white { background: #F8F8F4; -webkit-box-shadow: inset 0 0 0 2px #1E2A2F; box-shadow: inset 0 0 0 2px #1E2A2F; }
  .val { font-weight: bold; float: right; margin-top: -28px; line-height: 28px; position: relative; }

  .history { margin-top: 6px; background: #F7F5F0; border-radius: 28px; padding: 24px; }
  .history h2 { margin: 0 0 16px; font-size: 26px; }
  .hrow { margin-bottom: 14px; }
  .hrow .m { font-weight: bold; display: block; margin-bottom: 6px; }
  .hbar { font-size: 15px; margin-bottom: 5px; }
  .hbar .track { display: inline-block; width: 55%; margin-right: 0; vertical-align: middle; height: 20px; }
  .hbar .fill { display: block; -webkit-animation: none; animation: none; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var PERIODS = [
  { label: "September", short: "September", kind: "month",
    leo:    [3, 1, 3, 7, 4, 2],
    hannah: [3, 1, 0, 5, 4, 3] },
  { label: "Week of 29 Sep", short: "29 Sep", kind: "week",
    leo:    [1, 0, 0, 1, 1, 0],
    hannah: [3, 0, 0, 4, 2, 0] }
];

var ACTIVITIES = [
  "Piano practice", "Piano theory", "Trumpet practice",
  "Duolingo French", "Homework", "Reading"
];
var KIDS = [
  { key: "leo", name: "Leo", tone: "black" },
  { key: "hannah", name: "Hannah", tone: "white" }
];

function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }
function kidsHTML(idx) {
  var m = PERIODS[idx], prev = idx > 0 ? PERIODS[idx - 1] : null;
  var all = m.leo.concat(m.hannah);
  var top = 1;
  for (var t = 0; t < all.length; t++) if (all[t] > top) top = all[t];
  var html = "";
  for (var k = 0; k < KIDS.length; k++) {
    var kid = KIDS[k], counts = m[kid.key], total = sum(counts), note;
    if (!prev) { note = "First entry in the jar"; }
    else {
      var d = total - sum(prev[kid.key]);
      note = d > 0 ? (d + " more than " + prev.short) :
             d < 0 ? ((-d) + " fewer than " + prev.short) : ("Same as " + prev.short);
    }
    html += '<div class="kid"><h2>' + kid.name + '</h2>' +
      '<p class="total"><b>' + total + '</b> stones</p>' +
      '<p class="delta">' + note + '</p>' +
      '<ul class="bars">';
    for (var a = 0; a < ACTIVITIES.length; a++) {
      var pct = Math.max(Math.round(counts[a] / top * 100), counts[a] ? 4 : 0);
      html += '<li><span class="lbl">' + ACTIVITIES[a] + '</span>' +
        '<span class="track"><span class="fill ' + kid.tone + '" style="width:' + pct + '%;animation-delay:' + (a * 60) + 'ms;-webkit-animation-delay:' + (a * 60) + 'ms;"></span></span>' +
        '<span class="val">' + counts[a] + '</span></li>';
    }
    html += '</ul></div>';
  }
  return html;
}

function monthsHTML() {
  var html = "";
  for (var i = 0; i < PERIODS.length; i++) {
    html += '<li><button type="button" data-idx="' + i + '">' + PERIODS[i].label + '</button></li>';
  }
  return html;
}

function historyHTML() {
  var max = 1;
  for (var i = 0; i < PERIODS.length; i++) {
    var m = PERIODS[i];
    max = Math.max(max, sum(m.leo), sum(m.hannah));
  }
  var html = "";
  for (i = 0; i < PERIODS.length; i++) {
    var m = PERIODS[i];
    html += '<div class="hrow"><span class="m">' + m.short + '</span>';
    for (var k = 0; k < KIDS.length; k++) {
      var kid = KIDS[k], t = sum(m[kid.key]);
      var pct = Math.round(t / max * 100);
      html += '<div class="hbar"><span class="track"><span class="fill ' + kid.tone +
        '" style="width:' + pct + '%"></span></span> ' + kid.name + ' ' + t + '</div>';
    }
    html += '</div>';
  }
  return html;
}

function renderPage(idx) {
  document.getElementById("app").innerHTML =
    '<div class="wrap">' +
      '<h1>Our stone jars</h1>' +
      '<p class="sub">Every stone is one activity finished after school. Leo\'s stones are black and Hannah\'s are white.</p>' +
      '<ul class="months" id="months">' + monthsHTML() + '</ul>' +
      '<div class="kids" id="kids">' + kidsHTML(idx) + '</div>' +
      '<div class="history"><h2>Over time</h2><div id="hist-body">' + historyHTML() + '</div></div>' +
    '</div>';
  var btns = document.getElementById("months").getElementsByTagName("button");
  for (var b = 0; b < btns.length; b++) {
    btns[b].className = (b === idx) ? "active" : "";
    btns[b].onclick = (function (i) { return function () { renderPage(i); }; })(b);
  }
}

renderPage(PERIODS.length - 1);
</script>
</body>
</html>
